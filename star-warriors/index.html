<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Звёздные воины · версия 1.1</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b16;color:#e9f5f7;font-family:system-ui,sans-serif;touch-action:none}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:24px}h1{font-size:24px;letter-spacing:2px}p{color:#91a6ba;line-height:1.7}button{padding:14px 24px;border:1px solid #7cf7d6;border-radius:12px;background:#102a2d;color:#7cf7d6;font:inherit}small{color:#7cf7d6}</style>
</head><body>
<div id="loading"><small>v1.1 · TOUCH FIX</small><h1>ЗВЁЗДНЫЕ ВОИНЫ</h1><p id="status">Подготовка к полёту…</p><button id="reload" hidden>Повторить запуск</button></div>
<noscript>Для игры нужен браузер с включённым JavaScript.</noscript>
<script>
'use strict';
/* Star Warriors v1.1.0. Apply only to the immutable v1.0 baseline before execution. */
function patchGame(html) {
  function once(before, after) {
    const at = html.indexOf(before);
    if (at < 0 || html.indexOf(before, at + before.length) !== -1)
      throw new Error('Unexpected game source: ' + before.slice(0, 60));
    html = html.slice(0, at) + after + html.slice(at + before.length);
  }
  function section(start, end, replacement) {
    const a = html.indexOf(start), b = html.indexOf(end, a + start.length);
    if (a < 0 || b < 0) throw new Error('Missing game section: ' + start);
    html = html.slice(0, a) + replacement + '\n' + html.slice(b);
  }
  once('<title>Звёздные воины · Последняя орбита</title>', '<title>Звёздные воины · Последняя орбита · 1.1</title>');
  once('</style>', `
/* Keep playfield gestures inside the game, not text selection or page scrolling. */
html,body{touch-action:none;overscroll-behavior:none}
body{position:fixed;inset:0}
#app,#space{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#pause{touch-action:none}
#build-version{position:absolute;right:27px;bottom:8px;color:#91a6ba;font:8px var(--mono);letter-spacing:1px;pointer-events:none}
</style>`);
  section('  function resize(){', '  function showBanner(', `  function resize(){
    const rect=$('app').getBoundingClientRect();
    const nw=Math.max(1,rect.width),nh=Math.max(1,rect.height),nd=Math.min(window.devicePixelRatio||1,2);
    if(nebula && nw===W && nh===H && nd===DPR){measureMenu();return;}
    const ow=W,oh=H;W=nw;H=nh;DPR=nd;
    canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
    safeBottomOffset=(parseFloat(getComputedStyle($('controls')).bottom)||23)+(parseFloat(getComputedStyle($('shield')).minHeight)||78)+44;
    if(game){
      for(const a of [bullets,shots,enemies,pickups,particles,rings,floaters])for(const o of a){o.x*=W/ow;o.y*=H/oh;if(o.baseX!==undefined)o.baseX*=W/ow;}
      const b=bounds(),p=game.p;
      p.x=clamp(p.x*W/ow,23,W-23);p.y=clamp(p.y*H/oh,b.top,b.bottom);
      p.tx=clamp(p.tx*W/ow,23,W-23);p.ty=clamp(p.ty*H/oh,b.top,b.bottom);
      if(game.boss){game.boss.x*=W/ow;game.boss.y*=H/oh;}
      // Safari's dynamic viewport may resize while the finger is still down.
      // Preserve that pointer and rebase its coordinates instead of cancelling it.
      if(drag){const q=position(drag);drag.x=q.x;drag.y=q.y;}
    }
    makeBackground();measureMenu();
  }`);
  section('  function position(e){', '  const keyName=', `  function position(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
  const prevent=e=>{if(e.cancelable)e.preventDefault();};
  const endDrag=e=>{
    if(!drag||drag.id!==e.pointerId)return;
    const id=drag.id;drag=null;
    try{if(canvas.hasPointerCapture(id))canvas.releasePointerCapture(id);}catch{}
  };
  canvas.addEventListener('pointerdown',e=>{
    if(mode!=='playing'||!game||e.button>0)return;
    prevent(e);if(drag!==null)return;
    const q=position(e);
    drag={id:e.pointerId,x:q.x,y:q.y,clientX:e.clientX,clientY:e.clientY};
    game.moved=true;
    try{canvas.setPointerCapture(e.pointerId);}catch{}
    // Do not move iframe focus on every touch. Keyboard/mouse access still works.
    if(e.pointerType==='mouse')canvas.focus({preventScroll:true});
  },{passive:false});
  // The window listener also handles unexpected pointer-capture loss.
  // A different finger must never cancel the flight pointer.
  window.addEventListener('pointermove',e=>{
    if(!drag||drag.id!==e.pointerId||mode!=='playing'||!game)return;
    if(e.pointerType==='mouse'&&e.buttons===0){endDrag(e);return;}
    prevent(e);const q=position(e),b=bounds();
    game.p.tx=clamp(game.p.tx+(q.x-drag.x)*1.16,23,W-23);
    game.p.ty=clamp(game.p.ty+(q.y-drag.y)*1.16,b.top,b.bottom);
    drag.x=q.x;drag.y=q.y;drag.clientX=e.clientX;drag.clientY=e.clientY;
  },{passive:false,capture:true});
  window.addEventListener('pointerup',endDrag,true);
  window.addEventListener('pointercancel',endDrag,true);
  // Do not end a drag on lostpointercapture; pointerup/cancel own its lifetime.
  canvas.addEventListener('touchstart',prevent,{passive:false});
  canvas.addEventListener('touchmove',prevent,{passive:false});
  $('app').addEventListener('contextmenu',e=>{if(mode==='playing')prevent(e);});
  for(const name of ['gesturestart','gesturechange'])$('app').addEventListener(name,e=>{
    if(mode==='playing')prevent(e);
  },{passive:false});

  // Pause requires a tap that STARTS and ENDS on the button, not a passing swipe.
  const pauseButton=$('pause');let pausePress=null;
  pauseButton.addEventListener('pointerdown',e=>{
    if(e.button>0)return;prevent(e);
    pausePress={id:e.pointerId,x:e.clientX,y:e.clientY,at:performance.now(),moved:false,ended:false};
  });
  window.addEventListener('pointermove',e=>{
    if(pausePress&&pausePress.id===e.pointerId&&Math.hypot(e.clientX-pausePress.x,e.clientY-pausePress.y)>12)pausePress.moved=true;
  },true);
  window.addEventListener('pointerup',e=>{
    if(!pausePress||pausePress.id!==e.pointerId)return;
    const p=pausePress;pausePress=null;const r=pauseButton.getBoundingClientRect();
    const inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
    const tap=inside&&!p.moved&&Math.hypot(e.clientX-p.x,e.clientY-p.y)<=12&&performance.now()-p.at<800;
    if(tap){prevent(e);pauseGame();}
  },{capture:true,passive:false});
  window.addEventListener('pointercancel',e=>{if(pausePress&&pausePress.id===e.pointerId)pausePress=null;},true);
  pauseButton.addEventListener('click',e=>{
    // Touch/mouse already handled on pointerup; retain keyboard/assistive activation.
    if(e.detail===0&&!e.pointerType)pauseGame();
  });`);
  once("window.addEventListener('blur',()=>pauseGame());", "// Window blur does not mean the game is hidden (especially inside an iframe).\n  window.addEventListener('blur',()=>{keys.clear();});");
  once("$('pause').addEventListener('click',pauseGame);", '');
  once("window.addEventListener('orientationchange',()=>{drag=null;pauseGame();});", "window.addEventListener('orientationchange',()=>{last=performance.now();requestAnimationFrame(resize);});");
  once('  /* QA_HOOK */', `  document.documentElement.dataset.gameVersion='1.1.0';
  const build=document.createElement('span');build.id='build-version';build.textContent='v1.1 · TOUCH FIX';$('home').appendChild(build);
  /* QA_HOOK */`);
  if (html.includes("window.addEventListener('blur',()=>pauseGame())")) throw new Error('Old pause handler remains');
  return html;
}

// Immutable original artwork/game payload. Only the versioned input/lifecycle fixes above change it.
const baselineURL='https://raw.githubusercontent.com/sigafonx/Test001/ebae95c9bea8aafc5cf926c3b48ea073aab3cb96/star-warriors/index.html';
async function boot(){
  const button=document.getElementById('reload');button.hidden=true;
  document.getElementById('status').textContent='Подготовка к полёту…';
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);
  try{
    const response=await fetch(baselineURL,{signal:controller.signal});
    if(!response.ok)throw new Error('Game download: HTTP '+response.status);
    const wrapper=await response.text();
    const match=wrapper.match(/const packed=([\s\S]*?);/);
    if(!match)throw new Error('Game payload not found');
    const parts=[...match[1].matchAll(/'([A-Za-z0-9+/=]+)'/g)];
    if(!parts.length)throw new Error('Invalid game payload');
    const data=Uint8Array.from(atob(parts.map(p=>p[1]).join('')),c=>c.charCodeAt(0));
    const stream=new Blob([data]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=patchGame(await new Response(stream).text());
    clearTimeout(timeout);
    document.open();document.write(html);document.close();
  }catch(error){
    clearTimeout(timeout);
    document.getElementById('status').textContent='Не удалось загрузить игру. Проверь интернет и нажми «Повторить запуск».';
    button.hidden=false;console.error('Star Warriors 1.1:',error);
  }
}
document.getElementById('reload').addEventListener('click',boot);
boot();
</script></body></html>
